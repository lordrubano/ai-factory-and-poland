<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 6: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Проверяем вместе и передаём управление</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Вы сами входите со своего компьютера. Представитель записывает результаты.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 8-9</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">6 / 6</text><rect x="48" y="158" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="66" y="191.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">30 минут работы</text><text x="66" y="224.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Экран, мышь, клавиатура, файлы,</text><text x="66" y="247.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">терминал и права.</text><rect x="449" y="158" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="467" y="191.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">Отключение на 10 минут</text><text x="467" y="224.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Закрываем окно подключения: лёгкая</text><text x="467" y="247.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">проверочная программа продолжает</text><text x="467" y="269.14" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">работу.</text><rect x="850" y="158" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="868" y="191.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">Перезапуск удалённого ПК</text><text x="868" y="224.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Снова входим и проверяем сохранённый</text><text x="868" y="247.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">файл. Программу при необходимости</text><text x="868" y="269.14" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">запускаем заново.</text><rect x="48" y="292" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="66" y="325.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">Отказ основного пути</text><text x="66" y="358.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Входим через резерв. Проверяем</text><text x="66" y="381.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">сохранность файлов и запрет прямого</text><text x="66" y="403.14" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">обхода.</text><rect x="449" y="292" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="467" y="325.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">Обычный рабочий день</text><text x="467" y="358.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Измеряем стабильность соединения,</text><text x="467" y="381.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">разрывы и расход трафика.</text><rect x="850" y="292" width="382" height="119" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="868" y="325.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#196FD0">Аварийный доступ</text><text x="868" y="358.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">Проверяем, как вернуть управление без</text><text x="868" y="381.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#142B46">работающего прокси и телефона.</text><rect x="48" y="442" width="1184" height="113" rx="14" fill="#E8F2FF" stroke="none"/><rect x="67" y="460" width="44" height="44" rx="12" fill="#196FD0" stroke="none"/><text x="76" y="487.22" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">09</text><text x="129" y="480.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#196FD0">Передача вам</text><text x="129" y="517.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#142B46">Паспорта среды и канала • инструкции • поддержка • протокол 20 проверок. Временные права представителя убраны;</text><text x="129" y="542.2800000000001" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#142B46">вы ещё раз входите самостоятельно.</text><text x="48" y="589.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">Если обязательная проверка не пройдена, этап остаётся открытым. Просмотр схемы не заменяет испытания.</text><rect x="48" y="610" width="1184" height="58" rx="9" fill="#FFF0E6" stroke="none"/><text x="65" y="633.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#A34B1C">ДАЛЬШЕ: вы + AI → приложения и облачные LLM → копия проекта и генерация</text><text x="65" y="656.12" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#A34B1C">Затем → ещё 3 места → общие службы, собственная LLM и Пульт по готовности</text></svg>