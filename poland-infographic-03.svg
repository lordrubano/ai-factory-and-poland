<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 3: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Готовим компьютер в Польше</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Существующий компьютер остаётся у вас. Второй компьютер создаётся удалённо.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 4-5</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">3 / 6</text><rect x="48" y="171" width="465" height="200" rx="14" fill="#FFFFFF" stroke="#196FD0"/><rect x="61" y="184" width="439" height="162" rx="6" fill="#EDF5FF" stroke="none"/><text x="78" y="219.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#196FD0">Ваш существующий ПК</text><text x="78" y="258.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Ваши программы и файлы остаются здесь.</text><text x="78" y="282.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Позже настраивается только подключение.</text><rect x="224.7" y="371" width="111.6" height="13" rx="2" fill="#196FD0" stroke="none"/><rect x="150.3" y="384" width="260.40000000000003" height="8" rx="3" fill="#196FD0" stroke="none"/><rect x="717" y="171" width="515" height="200" rx="14" fill="#FFFFFF" stroke="#217858"/><rect x="730" y="184" width="489" height="162" rx="6" fill="#EFF8F4" stroke="none"/><text x="747" y="219.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#217858">Ваш удалённый Windows 11</text><text x="747" y="258.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Один персональный профиль и сохраняющийся диск.</text><text x="747" y="282.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Для основного варианта - Poland Central.</text><rect x="912.7" y="371" width="123.6" height="13" rx="2" fill="#217858" stroke="none"/><rect x="830.3" y="384" width="288.40000000000003" height="8" rx="3" fill="#217858" stroke="none"/><text x="538" y="241.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#506278">Сейчас:</text><text x="538" y="267.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#506278">подготовка</text><text x="538" y="288.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">Это два разных</text><text x="538" y="311.04" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">компьютера</text><rect x="48" y="420" width="1184" height="70" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="70" y="455.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142B46">Базовые ресурсы</text><text x="325" y="458.68" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#196FD0">4 vCPU • 16 ГБ памяти • 256 ГБ диск</text><text x="1022" y="457.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">512 ГБ - опция</text><rect x="48" y="512" width="1184" height="77" rx="14" fill="#E8F2FF" stroke="none"/><text x="70" y="544.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Представитель обновляет Windows, настраивает язык и клавиатуру, права установки и проверяет среду Linux для</text><text x="70" y="570.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">будущих инструментов (WSL2).</text><text x="48" y="615.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">VS Code, Claude Desktop и Claude Code устанавливаются позже с вами и AI.</text><text x="48" y="641.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">Авторизация в AI-сервисах и перенос копии проекта - следующий этап.</text><text x="48" y="663.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">vCPU - процессорные ресурсы виртуального компьютера; это не обещание выделенных физических ядер.</text></svg>