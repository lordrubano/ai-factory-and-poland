<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 1: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Выбираем услугу и согласуем цену</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Сначала понятное предложение. Затем ваше разрешение на оплату.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 1-2</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">1 / 6</text><rect x="48" y="162" width="572" height="252" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><rect x="68" y="182" width="44" height="44" rx="12" fill="#196FD0" stroke="none"/><text x="77" y="209.22" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">01</text><text x="128" y="205.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#142B46">Сравнить предложения</text><text x="70" y="257.48" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#196FD0">ПРЕДСТАВИТЕЛЬ В ПОЛЬШЕ</text><text x="70" y="288.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Находит одно рабочее место в Польше с Windows 11.</text><text x="70" y="312.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Проверяет помесячный договор, лицензии и возможность</text><text x="70" y="335.56" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">нужного подключения.</text><polyline points="70,350 598,350" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="70" y="380.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#196FD0">Вам передают рекомендованное предложение и резерв.</text><rect x="640" y="162" width="592" height="252" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><rect x="660" y="182" width="44" height="44" rx="12" fill="#A34B1C" stroke="none"/><text x="669" y="209.22" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">02</text><text x="720" y="205.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#142B46">Согласовать полный счёт</text><text x="662" y="257.48" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#A34B1C">ВЫ + ПРЕДСТАВИТЕЛЬ</text><text x="662" y="288.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Вы утверждаете поставщика, покупателя и сумму. В расчёте:</text><text x="662" y="312.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">аренда, необходимые лицензии, прокси и настройка. Условия</text><text x="662" y="335.56" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">продления и отмены фиксируются.</text><polyline points="662,350 1210,350" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="662" y="380.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#A34B1C">Заказываем одно место. Годовой договор не подменяет месяц.</text><text x="48" y="451.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142B46">Ориентиры из ТЗ на 07.10.2026 - окончательный счёт ещё согласуется</text><rect x="48" y="476" width="380" height="155" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="66" y="509.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">Windows 365 Enterprise</text><text x="66" y="543.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Основная корзина: €89,74 без НДС в месяц.</text><text x="66" y="563.92" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Диск 512 ГБ: €114,04. Прокси и настройка</text><text x="66" y="584.72" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">отдельно.</text><rect x="450" y="476" width="380" height="155" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="468" y="509.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">CloudPC.pl / Valcreon</text><text x="468" y="543.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Польский интегратор: 349 / 449 PLN в месяц.</text><text x="468" y="563.92" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Редакцию, НДС и полный состав</text><text x="468" y="584.72" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">подтвердить.</text><rect x="852" y="476" width="380" height="155" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="870" y="509.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">V2 Cloud / польский хостер</text><text x="870" y="543.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Резерв для сравнения. Нужна точная цена</text><text x="870" y="563.92" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">нужного места; опубликованное «от» не</text><text x="870" y="584.72" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">является сметой.</text><text x="48" y="658.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506278">Не складываем разные валюты. Дополнительные места, AI-подписки и GPU пока не покупаем.</text></svg>