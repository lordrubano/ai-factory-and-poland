<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 5: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Подключаем ваш компьютер</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Вы видите экран удалённого ПК и управляете им своей мышью и клавиатурой.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 7</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">5 / 6</text><rect x="48" y="210" width="245" height="146" rx="14" fill="#FFFFFF" stroke="#196FD0"/><rect x="61" y="223" width="219" height="108" rx="6" fill="#EDF5FF" stroke="none"/><text x="78" y="258.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#196FD0">Ваш ПК</text><text x="78" y="297.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Браузер / Windows</text><text x="78" y="321.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">App</text><rect x="141.1" y="356" width="58.8" height="13" rx="2" fill="#196FD0" stroke="none"/><rect x="101.9" y="369" width="137.20000000000002" height="8" rx="3" fill="#196FD0" stroke="none"/><rect x="405" y="175" width="220" height="93" rx="14" fill="#E8F2FF" stroke="#196FD0"/><text x="424" y="206.57999999999998" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#196FD0">Основной путь</text><text x="424" y="243.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Статический IP Польши</text><rect x="405" y="308" width="220" height="93" rx="14" fill="#F5F7FA" stroke="#D7E2EE"/><text x="424" y="340.58" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#142B46">Резервный путь</text><text x="424" y="369.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Другой статический IP</text><text x="424" y="389.92" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#142B46">Польши</text><rect x="725" y="239" width="170" height="118" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="744" y="274.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142B46">Защищённый</text><text x="744" y="300.4" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142B46">вход</text><text x="744" y="320.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#506278">Логин +</text><text x="744" y="339.8" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#506278">подтверждение</text><rect x="985" y="210" width="247" height="146" rx="14" fill="#FFFFFF" stroke="#217858"/><rect x="998" y="223" width="221" height="108" rx="6" fill="#EFF8F4" stroke="none"/><text x="1015" y="258.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#217858">Удалённый ПК</text><text x="1015" y="297.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#142B46">Windows 11 в Польше</text><rect x="1078.86" y="356" width="59.28" height="13" rx="2" fill="#217858" stroke="none"/><rect x="1039.34" y="369" width="138.32000000000002" height="8" rx="3" fill="#217858" stroke="none"/><polyline points="294,280 350,280 350,221 404,221" fill="none" stroke="#196FD0" stroke-width="2.5"/><polygon points="404,221 394.0,217.0 394.0,225.0" fill="#196FD0"/><polyline points="294,292 350,292 350,354 404,354" fill="none" stroke="#506278" stroke-width="2" stroke-dasharray="6 5"/><polygon points="404,354 394.0,350.0 394.0,358.0" fill="#506278"/><polyline points="626,221 679,221 679,280 724,280" fill="none" stroke="#196FD0" stroke-width="2.5"/><polygon points="724,280 714.0,276.0 714.0,284.0" fill="#196FD0"/><polyline points="626,354 679,354 679,304 724,304" fill="none" stroke="#506278" stroke-width="2" stroke-dasharray="6 5"/><polygon points="724,304 714.0,300.0 714.0,308.0" fill="#506278"/><polyline points="896,292 984,292" fill="none" stroke="#196FD0" stroke-width="2.5"/><polygon points="984,292 974.0,288.0 974.0,296.0" fill="#196FD0"/><text x="419" y="156.12" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#506278">Один из двух путей</text><rect x="48" y="427" width="1184" height="77" rx="14" fill="#E8F2FF" stroke="none"/><text x="70" y="463.86" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#196FD0">Программы выполняются на удалённом компьютере. Ваш ПК передаёт команды и показывает его</text><text x="70" y="493.76" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#196FD0">экран.</text><text x="48" y="545.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Представитель настраивает оба пути на вашем ПК. При отказе основного вы переподключаетесь через резерв; прямой</text><text x="48" y="571.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">обход не используется.</text><text x="48" y="602.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Прокси - промежуточный узел подключения. Польский номер используют для подтверждений при необходимости; он не определяет IP.</text><text x="48" y="653.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">Связи удалённого ПК с сервисами идут штатно, без этого клиентского прокси.</text></svg>