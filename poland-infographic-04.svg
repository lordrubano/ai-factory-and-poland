<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 4: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Защищаем вход и проверяем восстановление</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Правильные настройки подтверждаются пробой, а не обещанием.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 6</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">4 / 6</text><rect x="48" y="171" width="572" height="321" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="73" y="218.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#196FD0">Защита входа</text><rect x="73" y="253" width="236" height="63" rx="14" fill="#E8F2FF" stroke="none"/><text x="90" y="290.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#196FD0">Ваш пароль</text><text x="327" y="290.5" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#506278">+</text><rect x="372" y="253" width="223" height="63" rx="14" fill="#E8F2FF" stroke="none"/><text x="389" y="280.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#196FD0">Личное</text><text x="389" y="304.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#196FD0">подтверждение</text><text x="73" y="359.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142B46">Вы контролируете второй способ проверки входа.</text><text x="73" y="386.52" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142B46">Представитель настраивает защиту под отдельным</text><text x="73" y="413.82000000000005" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142B46">аккаунтом.</text><text x="73" y="460.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">Секреты не помещают в ТЗ и акт.</text><rect x="640" y="171" width="592" height="321" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="665" y="218.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#217858">Восстановление</text><rect x="665" y="253" width="158" height="63" rx="14" fill="#EFF8F4" stroke="none"/><text x="677" y="284.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#217858">Сохранить</text><text x="677" y="308.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#217858">точку</text><rect x="857" y="253" width="158" height="63" rx="14" fill="#EFF8F4" stroke="none"/><text x="869" y="284.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#217858">Восстановить</text><rect x="1049" y="253" width="158" height="63" rx="14" fill="#EFF8F4" stroke="none"/><text x="1061" y="284.76" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#217858">Проверить</text><text x="1061" y="308.15999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#217858">снова</text><polyline points="824,284 856,284" fill="none" stroke="#217858" stroke-width="2"/><polygon points="856,284 846.0,280.0 846.0,288.0" fill="#217858"/><polyline points="1016,284 1048,284" fill="none" stroke="#217858" stroke-width="2"/><polygon points="1048,284 1038.0,280.0 1038.0,288.0" fill="#217858"/><text x="665" y="359.22" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142B46">До переноса проектов реально восстанавливаем</text><text x="665" y="386.52" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#142B46">среду. Затем снова проверяем вход, права и WSL2.</text><text x="665" y="460.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">В Windows 365 восстанавливается весь ПК.</text><rect x="48" y="523" width="1184" height="126" rx="14" fill="#FFF0E6" stroke="none"/><text x="73" y="562.68" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#A34B1C">Вы получаете понятный путь возврата к работе</text><text x="73" y="599.58" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#142B46">Фиксируются первая точка восстановления, результат пробы и инструкция. Это не замена отдельной внешней резервной</text><text x="73" y="624.2800000000001" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#142B46">копии.</text></svg>