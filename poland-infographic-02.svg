<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Лист 2: первое рабочее место в Польше"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F6FA" stroke="none"/><rect x="48" y="24" width="168" height="26" rx="6" fill="#196FD0" stroke="none"/><text x="59" y="38.84" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ПОЛЬША • ЭТАП А</text><text x="235" y="40.48" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#506278">ПЕРВОЕ УДАЛЁННОЕ РАБОЧЕЕ МЕСТО</text><text x="48" y="92.24" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#142B46">Оформляем рабочее место на вас</text><text x="48" y="127.76" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506278">Отдельный рабочий логин. Управление и восстановление под вашим контролем.</text><polyline points="48,678 1232,678" fill="none" stroke="#D7E2EE" stroke-width="1"/><text x="48" y="698.84" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#506278">План работ по ТЗ 1.1 • 07.10.2026 • шаги 3</text><text x="1164" y="699.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#196FD0">2 / 6</text><rect x="48" y="175" width="380" height="196" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="72" y="223.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#196FD0">Вы</text><text x="72" y="270.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Вы лично подтверждаете оплату,</text><text x="72" y="296.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">вводите пароль и подтверждаете</text><text x="72" y="322.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">вход.</text><rect x="450" y="175" width="380" height="196" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="474" y="223.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#A34B1C">Представитель</text><text x="474" y="270.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Оформляет среду и учётные</text><text x="474" y="296.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">записи. Получает отдельный</text><text x="474" y="322.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">временный доступ для настройки.</text><rect x="852" y="175" width="380" height="196" rx="14" fill="#FFFFFF" stroke="#D7E2EE"/><text x="876" y="223.32" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#217858">Поставщик</text><text x="876" y="270.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Предоставляет согласованную</text><text x="876" y="296.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">услугу и необходимые лицензии.</text><polyline points="429,269 449,269" fill="none" stroke="#196FD0" stroke-width="2"/><polygon points="449,269 439.0,265.0 439.0,273.0" fill="#196FD0"/><polyline points="831,269 851,269" fill="none" stroke="#A34B1C" stroke-width="2"/><polygon points="851,269 841.0,265.0 841.0,273.0" fill="#A34B1C"/><rect x="48" y="396" width="572" height="187" rx="14" fill="#E8F2FF" stroke="none"/><text x="70" y="439.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#196FD0">Рабочий аккаунт - отдельный логин</text><text x="70" y="486.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Он нужен для удалённого компьютера. Вашу личную</text><text x="70" y="512.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">почту и её содержимое на сервер не переносим.</text><rect x="640" y="396" width="592" height="187" rx="14" fill="#FFF0E6" stroke="none"/><text x="662" y="439.04" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#A34B1C">Четыре роли фиксируем отдельно</text><text x="662" y="486.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">Владелец договора • плательщик • администратор •</text><text x="662" y="512.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">пользователь. Один человек может иметь несколько</text><text x="662" y="538.4" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#142B46">ролей.</text><text x="48" y="626.22" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#142B46">Результат: вы можете управлять услугой без единственного аккаунта представителя.</text><text x="48" y="659.94" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#506278">При окончательной передаче временные права настройщика отзываются.</text></svg>