  const update = () => {
    const active = !!document.fullscreenElement;
    button.textContent = active ? 'Выйти из полноэкранного' : 'На весь экран';
    button.setAttribute('aria-pressed', String(active));
    status.textContent = active ? 'Esc — выйти' : 'F11 — экран браузера';
  };
  button.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (typeof document.documentElement.requestFullscreen === 'function') await document.documentElement.requestFullscreen();
      else status.textContent = 'Нажмите F11 в браузере';
    } catch {
      status.textContent = 'Нажмите F11 в браузере';
    }
  });
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('fullscreenerror', () => { status.textContent = 'Нажмите F11 в браузере'; });
  update();
})();
</script>
</body>
</html>
